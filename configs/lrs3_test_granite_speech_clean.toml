experiment_name = "lrs3-test-granite-speech-clean"

[backend]
kind = "granite-speech"
model = "ibm-granite/granite-speech-4.1-2b"
device = "auto"
language = "en"

[noise]
enabled = false
kind = "white"
snr_db = 20.0
seed = 0

[input]
manifest_path = "data/lrs3/hf_test_full/manifest.csv"
audio_column = "audio_path"
reference_column = "reference"
id_column = "utterance_id"
language_column = "language"

[output]
output_dir = "outputs/lrs3_test_granite_speech_clean"
transcript_name = "transcripts.jsonl"
metrics_name = "metrics.json"

[wandb]
enabled = true
project = "team1-asr"
run_name = "lrs3-test-granite-speech-clean"
mode = "online"
log_transcripts = true
log_artifacts = false
