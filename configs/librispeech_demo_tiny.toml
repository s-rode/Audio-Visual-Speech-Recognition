experiment_name = "librispeech-demo-tiny-en"

[backend]
kind = "faster-whisper"
model = "tiny.en"
device = "cpu"
compute_type = "int8"
beam_size = 1
best_of = 1
language = "en"
task = "transcribe"
word_timestamps = false
vad_filter = false
condition_on_previous_text = false

[noise]
enabled = false
kind = "white"
snr_db = 20.0
seed = 0

[input]
manifest_path = "data/librispeech/validation/manifest.csv"
audio_column = "audio_path"
reference_column = "reference"
id_column = "utterance_id"
language_column = "language"

[output]
output_dir = "outputs/librispeech_demo_tiny"
transcript_name = "transcripts.jsonl"
metrics_name = "metrics.json"
