[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team1-asr"
version = "0.1.0"
description = "Modular ASR experiment pipeline for Whisper-based robustness studies."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "av>=14.0.0",
  "datasets>=4.0.0",
  "faster-whisper>=1.1.0",
  "gdown>=5.2.2",
  "jiwer>=3.0.0",
  "matplotlib>=3.9.4",
  "numpy>=1.26.0",
  "onnxruntime>=1.20",
  "scikit-image>=0.24.0",
  "scikit-learn>=1.5.0",
  "sentencepiece>=0.2.2",
  "soundfile>=0.12.1",
  "tensorboard>=2.21.0",
  "timm>=1.0.28",
  "torch==2.6.0",
  "torchaudio==2.6.0",
  "torchcodec>=0.9.1",
  "torchvision==0.21.0",
  "transformers>=4.57.6",
  "yt-dlp>=2025.10.14",
]

[project.optional-dependencies]
dev = []
noise = [
  "pyroomacoustics>=0.10.1",
  "scipy>=1.13.0",
]
tracking = [
  "wandb>=0.17.0",
]

[project.scripts]
team1-asr = "team1_asr.cli:main"
team1-download-model = "team1_asr.download_model:main"
team1-prepare-lrs3-hf = "team1_asr.prepare_lrs3_hf:main"
team1-preprocess-avec-video = "team1_asr.preprocess_avec_video:main"
team1-reliability = "team1_asr.reliability:main"
team1-prepare-librispeech = "team1_asr.prepare_librispeech:main"
team1-show-transcripts = "team1_asr.show_transcripts:main"
team1-prepare-lrs3-test = "team1_asr.prepare_lrs3_test_hf:main"

[tool.uv]
cache-dir = ".uv-cache"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
