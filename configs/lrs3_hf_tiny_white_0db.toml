experiment_name = "lrs3-hf-tiny-white-0db"

[backend]
kind = "faster-whisper"
model = "tiny.en"
device = "cpu"
compute_type = "int8"
beam_size = 1
best_of = 1
language = "en"
task = "transcribe"
word_timestamps = false
vad_filter = false
condition_on_previous_text = false

[noise]
seed = 0

[noise.demand]
enabled = true
snr_db = -5
noise_path = "data/DEMAND/16k"

[noise.reverb]
enabled = true
length_range = [5.0, 15.0]
width_range = [5.0, 15.0]
height_range = [2.0, 6.0]
rt60_range = [0.4, 1.0]

[noise.bandwidth]
enabled = true
available_filters = ["butter", "bessel", "cheby1"]
available_cutoffs_hz = [2000, 4000, 8000]
filter_order = 5


[input]
manifest_path = "data/lrs3/hf_train_100/manifest.csv"
audio_column = "audio_path"
reference_column = "reference"
id_column = "utterance_id"
language_column = "language"

[output]
output_dir = "outputs/lrs3_hf_tiny_white_0db"
transcript_name = "transcripts.jsonl"
metrics_name = "metrics.json"
