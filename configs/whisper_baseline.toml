experiment_name = "whisper-small-en-baseline"

[backend]
kind = "faster-whisper"
model = "small.en"
device = "auto"
compute_type = "default"
beam_size = 5
best_of = 5
language = "en"
task = "transcribe"
word_timestamps = true
vad_filter = true
condition_on_previous_text = true

[noise]
seed = 0

[noise.demand]
enabled = true
snr_db = -5
noise_path = "data/DEMAND/16k"

[noise.reverb]
enabled = true
length_range = [5.0, 15.0]
width_range = [5.0, 15.0]
height_range = [2.0, 6.0]
rt60_range = [0.4, 1.0]

[noise.bandwidth]
enabled = true
available_filters = ["butter", "bessel", "cheby1"]
available_cutoffs_hz = [2000, 4000, 8000]
filter_order = 5


[input]
manifest_path = "data/manifest.csv"
audio_column = "audio_path"
reference_column = "reference"
id_column = "utterance_id"
language_column = "language"

[output]
output_dir = "outputs/whisper_baseline"
transcript_name = "transcripts.jsonl"
metrics_name = "metrics.json"
