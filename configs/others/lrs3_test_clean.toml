experiment_name = "lrs3-hf-small-clean"

[backend]
kind = "faster-whisper"
model = "small.en"
device = "cpu"
compute_type = "int8"
beam_size = 1
best_of = 1
language = "en"
task = "transcribe"
word_timestamps = false
vad_filter = false
condition_on_previous_text = false

[noise]
seed = 0

[noise.demand]
enabled = false

[noise.reverb]
enabled = false

[noise.bandwidth]
enabled = false

[input]
manifest_path = "data/lrs3/hf_test_full/manifest.csv"
audio_column = "audio_path"
reference_column = "reference"
id_column = "utterance_id"
language_column = "language"

[output]
output_dir = "outputs/lrs3_test_small_clean"
transcript_name = "transcripts.jsonl"
metrics_name = "metrics.json"

[wandb]
enabled = true
project = "team1-asr"
run_name = "lrs3-test-small-clean"
mode = "online"
log_transcripts = true
