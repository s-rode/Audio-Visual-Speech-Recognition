experiment_name = "voxmm-dev-eval-whisper-base-local"

[backend]
kind = "faster-whisper"
model = "base.en"
device = "cpu"
compute_type = "int8"
beam_size = 1
best_of = 1
language = "en"
task = "transcribe"
word_timestamps = false
vad_filter = false
condition_on_previous_text = false

[noise]
enabled = false

[input]
manifest_path = "data/voxmm_dev_eval/manifest.local.csv"
audio_column = "audio_path"
reference_column = "reference"
id_column = "utterance_id"
language_column = "language"

[output]
output_dir = "outputs/voxmm_routing_comparison/whisper_base"
transcript_name = "transcripts.jsonl"
metrics_name = "metrics.json"

[wandb]
enabled = false
