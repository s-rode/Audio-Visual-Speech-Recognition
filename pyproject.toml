[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team1-asr"
version = "0.1.0"
description = "Modular ASR experiment pipeline for Whisper-based robustness studies."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "faster-whisper>=1.1.0",
  "jiwer>=3.0.0",
  "numpy>=1.26.0",
  "soundfile>=0.12.1",
]

[project.optional-dependencies]
dev = []

[project.scripts]
team1-asr = "team1_asr.cli:main"
team1-prepare-tedlium = "team1_asr.prepare_tedlium:main"

[tool.uv]
cache-dir = ".uv-cache"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
