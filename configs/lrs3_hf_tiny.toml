experiment_name = "lrs3-hf-tiny-en"

[backend]
kind = "faster-whisper"
model = "tiny.en"
device = "cpu"
compute_type = "int8"
beam_size = 1
best_of = 1
language = "en"
task = "transcribe"
word_timestamps = false
vad_filter = false
condition_on_previous_text = false

[noise]
enabled = false
kind = "white"
snr_db = 20.0
seed = 0

[input]
manifest_path = "data/lrs3/hf_train_100/manifest.csv"
audio_column = "audio_path"
reference_column = "reference"
id_column = "utterance_id"
language_column = "language"

[output]
output_dir = "outputs/lrs3_hf_tiny"
transcript_name = "transcripts.jsonl"
metrics_name = "metrics.json"

[wandb]
enabled = true
project = "team1-asr"
run_name = "lrs3-tiny-baseline"
mode = "online"
log_transcripts = true
