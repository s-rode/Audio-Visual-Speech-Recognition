experiment_name = "lrs3-test-granite-speech-advanced-minus5db"

[backend]
kind = "granite-speech"
model = "ibm-granite/granite-speech-4.1-2b"
device = "auto"
language = "en"

[noise]
seed = 0

[noise.demand]
enabled = true
snr_db = -5.0
noise_path = "DEMAND/16k"

[noise.reverb]
enabled = true
length_range = [5.0, 15.0]
width_range = [5.0, 15.0]
height_range = [2.0, 6.0]
rt60_range = [0.4, 1.0]

[noise.bandwidth]
enabled = true
available_filters = ["butter", "bessel", "cheby1"]
available_cutoffs_hz = [2000, 4000, 8000]
filter_order = 5

[input]
manifest_path = "data/lrs3/hf_test_full/manifest.csv"
audio_column = "audio_path"
reference_column = "reference"
id_column = "utterance_id"
language_column = "language"

[output]
output_dir = "outputs/lrs3_test_granite_speech_advanced_-5db"
transcript_name = "transcripts.jsonl"
metrics_name = "metrics.json"

[wandb]
enabled = true
project = "team1-asr"
run_name = "lrs3-test-granite-speech-advanced-minus5db"
mode = "online"
log_transcripts = true
log_artifacts = false
