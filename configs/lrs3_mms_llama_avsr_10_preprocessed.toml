experiment_name = "lrs3-mms-llama-avsr-10-preprocessed"

[backend]
kind = "mms-llama"
model = "mms-llama-1759h"
repo_path = "external/MMS-LLaMA"
checkpoint_path = "external/MMS-LLaMA/pretrained_models/mms_llama/1759h/checkpoint_best.pt"
llm_path = "meta-llama/Llama-3.2-3B"
noise_wav = "external/MMS-LLaMA/noise/babble_noise.wav"
results_dir = "outputs/mms_llama"
modalities = ["video", "audio"]
beam_size = 5
python_executable = "external/MMS-LLaMA/.venv/bin/python"
cuda_visible_devices = "0"

[input]
manifest_path = "data/lrs3/hf_av_smoke_10_avhubert/manifest.csv"
audio_column = "audio_path"
video_column = "video_path"
reference_column = "reference"
id_column = "utterance_id"
language_column = "language"

[noise.demand]
enabled = false
snr_db = 0.0
noise_path = ""

[output]
output_dir = "outputs/lrs3_mms_llama_avsr_10_preprocessed"
transcript_name = "transcripts.jsonl"
metrics_name = "metrics.json"
